# Operator configuration. Callers may override only the roles listed in
# `allow_request_overrides`; the comparator is never caller-overridable because its
# structured output *is* the control flow.
#
# Slugs below were reconciled against OpenRouter's live catalogue. Re-run `make doctor` after
# any gap in work: models are retired regularly, and it prints the closest available
# alternative for anything that has rotted. A pin that vanished should fail at boot with a
# suggestion, never mid-run.

caps:
  max_panel: 5
  min_quorum: 2
  max_rounds: 2               # debate hard stop; past this, capitulation outpaces truth
  max_verified_disputes: 3    # grounded calls are billed per request; drops are logged
  search_max_results: 5
  per_call_timeout_s: 90
  panel_call_timeout_s: 60

# The panel picker is a curated shortlist spanning distinct families, so the
# family-diversity and min-context rules are enforceable and no junk model can break
# fan-out mid-demo.
panel_shortlist:
  - openai/gpt-5.2
  - anthropic/claude-sonnet-5
  - google/gemini-3.5-flash
  - deepseek/deepseek-v3.2
  - qwen/qwen3-max
  - meta-llama/llama-4-maverick
  - mistralai/mistral-medium-3.1
  - x-ai/grok-4.6

# Three distinct families, and deliberately disjoint from every referee chain below so a
# default run needs no substitution and carries no self-preference stamp. Selecting a model
# that is also a referee is allowed — the invariant fires at request time and says so.
panel_default:
  - openai/gpt-5.2
  - deepseek/deepseek-v3.2
  - qwen/qwen3-max

# Each role is a fallback chain: a single pinned slug will rate-limit mid-demo.
# off_panel: require -> substitute or stamp the run; prefer -> warn only.
roles:
  comparator:
    # Reads every answer, so it wants the largest context in the stack.
    chain: [google/gemini-2.5-pro, anthropic/claude-sonnet-5]
    prompt_version: comparator_v1
    require_structured: true
    off_panel: prefer
    temperature: 0.0
  verifier:
    # search_engine: exa — OpenRouter performs the retrieval and normalises citations, so the
    # seat is not restricted to the short list of models advertising their own search (which
    # currently excludes every Gemini model and would pin us to a 2023-cutoff model — exactly
    # wrong for a verifier, whose most valuable case is a fact that changed recently).
    chain: [anthropic/claude-haiku-4.5, google/gemini-3.5-flash]
    prompt_version: verifier_v1
    require_structured: true
    require_web: true
    search_engine: exa
    off_panel: require
    temperature: 0.0
  synthesizer:
    # A different family from the comparator, so the writer does not inherit the gate's
    # framing of the dispute along with its verdict.
    chain: [anthropic/claude-sonnet-5, mistralai/mistral-medium-3.1]
    prompt_version: synthesizer_v1
    require_structured: true
    off_panel: require
    temperature: 0.0
  normalizer:
    # Extractive and high-volume, so cheap and long-context matters more than reasoning.
    chain: [openai/gpt-5.6-luna, anthropic/claude-haiku-4.5]
    prompt_version: normalizer_v1
    require_structured: true
    off_panel: prefer
    temperature: 0.0
  red_team:
    # Prefer a family absent from the default panel entirely: the whole value of this seat is
    # running a different search over the same knowledge.
    chain: [x-ai/grok-4.6, anthropic/claude-sonnet-5]
    prompt_version: redteam_v1
    require_structured: true
    off_panel: prefer
    temperature: 0.0

# The re-entrant panel seats. Listed here so all nine prompts are configuration rather than
# three of them being literals in Python, and so `doctor` checks every one has a file.
panel_prompts:
  answer: panel_v1
  debate_round_1: debate_r1_v1
  debate_round_2: debate_r2_v1

allow_request_overrides: [synthesizer, verifier]

# (comparator_slug, prompt_version) pairs measured against api/app/evalset/cases.
# A run whose comparator config is absent here is stamped `gate: unvalidated`, because the
# calibration belongs to the pair — swap either half and the measurement no longer applies.
# Re-run `make eval` after any prompt edit; the prompt version is part of the call key, so
# recordings correctly miss rather than replaying the old behaviour.
verified_configs:
  - slug: google/gemini-2.5-pro
    prompt_version: comparator_v1
    material_recall: 1.00
